name: Test nonexistent path succeeds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure path does not exist
        run: rm -rf "$GITHUB_WORKSPACE/does-not-exist-xyz"
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/does-not-exist-xyz
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success for nonexistent path"
            exit 1
          fi
          if [ -e "$GITHUB_WORKSPACE/does-not-exist-xyz" ]; then
            echo "FAIL: path unexpectedly exists"
            exit 1
          fi
          echo "PASS"
