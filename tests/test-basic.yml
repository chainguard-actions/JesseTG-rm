name: Test basic file removal
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file
        run: |
          echo "hello world" > /tmp/test-rm-file.txt
          if [ ! -f /tmp/test-rm-file.txt ]; then
            echo "FAIL: could not create test file"
            exit 1
          fi
          echo "Test file created successfully"

      - id: action
        uses: .
        with:
          path: /tmp/test-rm-file.txt

      - name: Assert file was removed
        run: |
          if [ -e /tmp/test-rm-file.txt ]; then
            echo "FAIL: file still exists after removal"
            exit 1
          fi
          echo "PASS: file was successfully removed"
