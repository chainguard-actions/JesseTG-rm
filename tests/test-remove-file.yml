name: Test remove file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create file
        run: |
          echo "hello" > "$GITHUB_WORKSPACE/rm-test-file.txt"
          test -f "$GITHUB_WORKSPACE/rm-test-file.txt"
      - id: action
        uses: .
        with:
          path: ${{ github.workspace }}/rm-test-file.txt
      - name: Assert file removed
        run: |
          if [ -e "$GITHUB_WORKSPACE/rm-test-file.txt" ]; then
            echo "FAIL: file still exists"
            exit 1
          fi
          echo "PASS"
